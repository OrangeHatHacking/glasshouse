<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glasshouse</title>
  <style>
    :root {
      --bg: #0d0d0d;
      --surface: #1a1a1a;
      --border: #2a2a2a;
      --text: #e0e0e0;
      --muted: #888;
      --accent: #4ade80;
      --warn: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', monospace;
      font-size: 14px;
      padding: 0;
    }
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
    }
    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    nav a:hover, nav a.active { color: var(--accent); }
    nav .brand {
      color: var(--accent);
      font-weight: bold;
      font-size: 14px;
      margin-right: 8px;
    }
    main { padding: 16px; max-width: 900px; }
    h2 {
      color: var(--accent);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin-bottom: 20px;
    }
    th {
      text-align: left;
      color: var(--muted);
      font-weight: normal;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 11px;
    }
    td { padding: 6px 8px; border-bottom: 1px solid var(--border); }
    tr:hover td { background: var(--surface); }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .badge-bodycam { background: #7c3aed33; color: #a78bfa; border: 1px solid #7c3aed55; }
    .badge-drone    { background: #0369a133; color: #38bdf8; border: 1px solid #0369a155; }
    .badge-doorbell { background: #92400e33; color: #fbbf24; border: 1px solid #92400e55; }
    .badge-radio    { background: #065f4633; color: #34d399; border: 1px solid #065f4655; }
    .badge-smartglass { background: #9f123533; color: #fb7185; border: 1px solid #9f123555; }
    .badge-custom   { background: #1e293b; color: var(--muted); border: 1px solid var(--border); }
    form.inline { display: inline; }
    input[type=text], input[type=number], input[type=password], select {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      font-family: inherit;
      font-size: 13px;
      border-radius: 3px;
      width: 100%;
      margin-bottom: 8px;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }
    button, .btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 14px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    button:hover, .btn:hover { border-color: var(--accent); color: var(--accent); }
    button.danger:hover { border-color: var(--danger); color: var(--danger); }
    .field { margin-bottom: 12px; }
    label { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    .rssi-strong { color: var(--accent); }
    .rssi-medium { color: var(--warn); }
    .rssi-weak   { color: var(--danger); }
    .empty { color: var(--muted); font-size: 12px; padding: 20px 0; }
  </style>
</head>
<body>
  <nav>
    <span class="brand">GLASSHOUSE</span>
    <a href="/">Dashboard</a>
    <a href="/scan/">Scan</a>
    <a href="/vendors/">Vendors</a>
    <a href="/filters/">Filters</a>
    <a href="/devices/">Devices</a>
    <a href="/export/detections.json">Export</a>
    <a href="/settings/">Settings</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
