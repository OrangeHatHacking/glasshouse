{% extends "base.html" %}
{% block content %}
<h2>Settings</h2>
<h2 style="margin-top:20px;">Appearance</h2>
<div class="field">
  <label for="theme">Theme</label>
  <select id="theme">
    <option value="terminal">Terminal</option>
    <option value="amber">Amber</option>
    <option value="blueprint">Blueprint</option>
    <option value="gruvbox">Gruvbox Dark</option>
    <option value="neon-riot">Neon Riot</option>
  </select>
</div>
<script>
const themeSelect = document.getElementById("theme");
themeSelect.value = localStorage.getItem("glasshouse-theme") || "terminal";
themeSelect.addEventListener("change", function() {
  localStorage.setItem("glasshouse-theme", this.value);
  document.documentElement.dataset.theme = this.value;
});
</script>
<form method="post" action="/settings/save">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <h2 style="margin-top:20px;">MQTT</h2>
  <div class="field">
    <label><input type="checkbox" name="mqtt_enabled"
      {% if settings.mqtt_enabled == '1' %}checked{% endif %}> Enable MQTT reporting</label>
  </div>
  <div class="field">
    <label>Broker IP / hostname</label>
    <input type="text" name="mqtt_broker" value="{{ settings.mqtt_broker }}" placeholder="192.168.1.x">
  </div>
  <div class="field">
    <label>Port</label>
    <input type="number" name="mqtt_port" value="{{ settings.mqtt_port or '1883' }}">
  </div>
  <div class="field">
    <label>Username (optional)</label>
    <input type="text" name="mqtt_user" value="{{ settings.mqtt_user }}">
  </div>
  <div class="field">
    <label>Password{% if settings.mqtt_password_set %} (set - leave blank to keep){% endif %}</label>
    <input type="password" name="mqtt_password" placeholder="{% if settings.mqtt_password_set %}unchanged{% else %}optional{% endif %}">
  </div>
  <div class="field">
    <label>Topic</label>
    <input type="text" name="mqtt_topic" value="{{ settings.mqtt_topic or 'glasshouse/detection' }}">
  </div>
  <div class="field">
    <label><input type="checkbox" name="mqtt_tls"
      {% if settings.mqtt_tls == '1' %}checked{% endif %}> Require TLS</label>
  </div>

  <h2 style="margin-top:20px;">Hardware</h2>
  <div class="field">
    <label><input type="checkbox" name="led_enabled"
      {% if settings.led_enabled != '0' %}checked{% endif %}> LED alerts enabled</label>
  </div>
  <div class="field">
    <label><input type="checkbox" name="buzzer_enabled"
      {% if settings.buzzer_enabled == '1' %}checked{% endif %}> Buzzer enabled (requires hardware)</label>
  </div>

  <button type="submit">Save Settings</button>
</form>
{% endblock %}
