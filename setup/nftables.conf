#!/usr/sbin/nft -f
# minimal firewall for AP interface
# Only port 443 (HTTPS/mTLS) is reachable on wlan0.
# All other inbound traffic on the AP interface is dropped.

flush ruleset

table inet glasshouse {
    chain input {
        type filter hook input priority 0; policy drop;

        # Allow loopback
        iif lo accept

        # Allow established/related
        ct state established,related accept

        # Allow DHCP from AP clients (UDP 67)
        iif wlan0 udp dport 67 accept

        # Allow HTTPS (mTLS web UI) from AP clients only
        iif wlan0 tcp dport 443 accept

        # Drop everything else on AP interface silently
        iif wlan0 drop
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
        # no forwarding, not acting as router
    }

    chain output {
        type filter hook output priority 0; policy accept;
        # Outbound unrestricted (MQTT to external broker if enabled)
    }
}
